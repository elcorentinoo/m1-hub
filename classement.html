<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Classement · AAA</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fond);color:var(--txt);line-height:1.55;font-size:16px}
#topbar{display:flex;align-items:center;gap:14px;padding:12px 24px}
#content{max-width:880px;margin:0 auto;padding:28px 24px 120px;min-width:0}

.tag{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--txt3);margin-bottom:12px}
h1{font-weight:200;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.02;letter-spacing:-.03em;margin-bottom:12px;color:var(--nuit)}
h1 b{font-weight:500}
.sous{font-size:16.5px;color:var(--txt2);max-width:60ch;margin-bottom:22px}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.pil{border:none;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:500;cursor:pointer;background:var(--blanc);color:var(--nuit);box-shadow:var(--ombre1)}
.pil:hover{background:var(--surface2)}
.pil.fonce{background:var(--nuit);color:#fff}
.pil.fonce:hover{background:var(--nuit);opacity:.92}

.onglets{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--blanc);box-shadow:var(--shadow);margin-bottom:24px;max-width:100%}
.onglets button{border:none;background:transparent;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;color:var(--txt2);cursor:pointer;white-space:nowrap}
.onglets button[aria-selected="true"]{background:var(--nuit);color:#fff}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;margin-bottom:18px}
.marche{background:var(--blanc);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 18px 18px;text-align:center;min-width:0;position:relative}
.marche.r1{padding-top:30px;padding-bottom:26px}
.marche .rg{width:38px;height:38px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--surface2);color:var(--nuit)}
.marche.r1 .rg{background:var(--nuit);color:#fff;width:44px;height:44px}
.marche .nm{font-weight:500;font-size:16px;overflow-wrap:anywhere;margin-bottom:6px}
.marche .val{font-weight:200;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1;color:var(--nuit);letter-spacing:-.03em}
.marche .val small{font-size:.45em;font-weight:400;margin-left:2px}
.marche .sec{font-size:12.5px;color:var(--txt3);margin-top:8px}
.marche.moi{box-shadow:0 0 0 2px var(--nuit),var(--shadow)}

.liste{background:var(--blanc);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.ligne{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.1fr) 76px;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--stroke)}
.ligne:first-child{border-top:none}
.ligne .rg{font-weight:600;color:var(--txt3);font-size:14px}
.ligne .nm{font-weight:500;overflow-wrap:anywhere}
.ligne .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--txt3)}
.jauge{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:999px;background:var(--nuit)}
.ligne .val{text-align:right;font-weight:500;font-size:17px;color:var(--nuit)}
.ligne.moi{background:var(--surface2)}
.toi{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--nuit);color:#fff;border-radius:999px;padding:2px 8px;vertical-align:2px}

.note{font-size:13.5px;color:var(--txt3);margin-top:16px;max-width:70ch}
.vide{background:var(--blanc);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:34px 24px;text-align:center;color:var(--txt2)}
.diag{background:var(--blanc);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px 24px;border-left:5px solid var(--bad)}
.diag h2{font-weight:500;font-size:1.1rem;color:var(--bad);margin-bottom:8px}
.diag code{background:var(--surface2);padding:2px 6px;border-radius:6px;font-size:13px}
.attente{margin-top:14px;font-size:13.5px;color:var(--txt3)}

@media(max-width:640px){
  #content{padding:22px 16px 110px}
  .podium{gap:8px}
  .marche{padding:16px 8px 14px}
  .marche.r1{padding-top:22px}
  .marche .nm{font-size:14px}
  .ligne{grid-template-columns:30px minmax(0,1fr) 64px;gap:10px;padding:13px 14px}
  .ligne .jauge{grid-column:2 / 4;grid-row:2}
  .onglets{display:flex;width:100%}
  .onglets button{flex:1;padding:10px 8px;font-size:13px;white-space:normal;line-height:1.2}
}
</style>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ECEEF6">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AAA">
</head>
<body>

<div id="topbar">
  <span id="nav-slot"></span>
  <span id="lb-id-slot"></span>
</div>

<main id="content">
  <div class="tag">Classement partagé · M1 MBAF</div>
  <h1>Qui révise <b>le plus</b> ?</h1>
  <p class="sous">Deux classements de la promo, mis à jour à chaque visite : qui a le plus avancé dans ses cours, et qui répond le plus juste.</p>

  <div class="actions">
    <button class="pil fonce" id="btn-id" type="button">Choisir ou changer mon pseudo</button>
    <button class="pil" id="btn-refresh" type="button">↻ Actualiser</button>
  </div>

  <div class="onglets" role="tablist" aria-label="Type de classement">
    <button type="button" role="tab" id="tab-c" aria-selected="true" aria-controls="zone">Qui complète le plus</button>
    <button type="button" role="tab" id="tab-r" aria-selected="false" aria-controls="zone">Meilleur taux de réussite</button>
  </div>

  <div id="zone" role="tabpanel" aria-live="polite"><div class="vide">Chargement du classement…</div></div>
</main>

<script src="lb.js"></script>
<script src="progress.js"></script>
<script src="banque.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   Le classement.
   · « Qui complète le plus » : moyenne, sur les cours du M1, du
     pourcentage de complétion de chacun (leçons 50 % · mini-quiz 25 %
     · test final 25 %, le calcul de « Ma progression »).
   · « Meilleur taux de réussite » : bonnes réponses ÷ questions sur
     les tests finaux et les séries d'entraînement enregistrés.
   Les données viennent de la table Supabase partagée (lb.js).
   ════════════════════════════════════════════════════════════ */
let DATA = null, ONGLET = 'c';
try{ ONGLET = localStorage.getItem('clt_onglet') === 'r' ? 'r' : 'c'; }catch(e){}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').trim().toLowerCase(); }
function pctFr(x){ return (Math.round(x*10)/10).toLocaleString('fr-FR',{maximumFractionDigits:1}); }
function nb(n){ return Number(n).toLocaleString('fr-FR'); }

function valeur(x){
  return ONGLET==='c'
    ? {v:pctFr(x.completion), unite:'%', jauge:x.completion,
       sec: nb(x.lecons)+' leçon'+(x.lecons>1?'s':'')+' validée'+(x.lecons>1?'s':'')}
    : {v:pctFr(x.pct), unite:'%', jauge:x.pct,
       sec: nb(x.correct)+' / '+nb(x.questions)+' bonnes réponses'};
}

function dessiner(){
  document.getElementById('tab-c').setAttribute('aria-selected', ONGLET==='c');
  document.getElementById('tab-r').setAttribute('aria-selected', ONGLET==='r');
  const zone = document.getElementById('zone');
  if(!DATA) return;
  const liste = ONGLET==='c' ? DATA.completion : DATA.reussite;
  const moi = norm(window.LB ? LB.pseudo() : '');

  if(!liste.length){
    zone.innerHTML = '<div class="vide">'+(ONGLET==='c'
      ? "Personne n'apparaît encore ici. La progression s'enregistre dès qu'une personne ayant choisi un pseudo ouvre l'accueil ou un cours."
      : "Personne n'a encore répondu à "+LB.MIN_QUESTIONS+" questions enregistrées. Passe un test final ou une série d'entraînement pour apparaître ici.")+'</div>'+note();
    return;
  }

  const top = liste.slice(0,3);
  const ordre = top.length===3 ? [top[1],top[0],top[2]] : top.length===2 ? [top[1],top[0]] : [top[0]];
  const podium = '<div class="podium" style="grid-template-columns:repeat('+ordre.length+',1fr)">'+ordre.map(x=>{
    const r = liste.indexOf(x)+1, v = valeur(x), estMoi = norm(x.pseudo)===moi;
    return '<div class="marche r'+r+(estMoi?' moi':'')+'">'+
      '<div class="rg" aria-label="'+r+'e place">'+r+'</div>'+
      '<div class="nm">'+esc(x.pseudo)+(estMoi?'<span class="toi">toi</span>':'')+'</div>'+
      '<div class="val">'+v.v+'<small>'+v.unite+'</small></div>'+
      '<div class="sec">'+v.sec+'</div></div>';
  }).join('')+'</div>';

  const reste = liste.slice(3);
  const lignes = reste.length ? '<div class="liste">'+reste.map((x,i)=>{
    const r = i+4, v = valeur(x), estMoi = norm(x.pseudo)===moi;
    return '<div class="ligne'+(estMoi?' moi':'')+'">'+
      '<span class="rg">'+r+'</span>'+
      '<span class="nm">'+esc(x.pseudo)+(estMoi?'<span class="toi">toi</span>':'')+'<small>'+v.sec+'</small></span>'+
      '<span class="jauge" aria-hidden="true"><i style="width:'+Math.max(2,Math.min(100,v.jauge))+'%"></i></span>'+
      '<span class="val">'+v.v+' '+v.unite+'</span></div>';
  }).join('')+'</div>' : '';

  let attente = '';
  if(ONGLET==='c' && DATA.enAttente.length){
    attente = '<p class="attente">Pas encore de progression enregistrée pour : '+DATA.enAttente.map(x=>esc(x.pseudo)).join(', ')+
      '. Elle apparaîtra à leur prochaine visite sur le site.</p>';
  }
  zone.innerHTML = podium + lignes + attente + note();
}

function note(){
  return '<p class="note">'+(ONGLET==='c'
    ? "Complétion : la moyenne de tes "+DATA.nbCours+" cours, chacun calculé comme dans « Ma progression » — leçons validées 50 %, mini-quiz réussis 25 %, test final 25 % (compté en entier dès 80 % de bonnes réponses). Un cours jamais ouvert compte 0 %. Égalité départagée par le nombre de leçons validées."
    : "Taux de réussite : bonnes réponses ÷ questions, sur les tests finaux et les séries d'entraînement enregistrés avec ton pseudo. Il faut au moins "+LB.MIN_QUESTIONS+" questions pour apparaître. Égalité départagée par le nombre de questions.")+'</p>';
}

function erreur(titre, corps){
  document.getElementById('zone').innerHTML = '<div class="diag"><h2>'+titre+'</h2><div>'+corps+'</div></div>';
}

async function charger(){
  const zone = document.getElementById('zone');
  zone.innerHTML = '<div class="vide">Chargement du classement…</div>';
  if(!window.LB || !LB.configured()){
    return erreur("Le classement n'est pas encore configuré", "Renseigne le projet Supabase en haut du fichier <code>lb.js</code>.");
  }
  try{ await LB.syncProgression(); }catch(e){}   // ta propre progression d'abord
  const rows = await LB.fetchAll();
  if(rows === null){
    return erreur("Le classement n'a pas pu être chargé", LB.diagnose ? LB.diagnose() : "Vérifie la connexion.");
  }
  DATA = LB.rankings(rows);
  dessiner();
}

function choisir(o){ ONGLET = o; try{ localStorage.setItem('clt_onglet', o); }catch(e){} dessiner(); }
document.getElementById('tab-c').onclick = ()=>choisir('c');
document.getElementById('tab-r').onclick = ()=>choisir('r');
document.querySelector('.onglets').addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' || e.key==='ArrowLeft'){ e.preventDefault(); choisir(ONGLET==='c'?'r':'c'); document.getElementById(ONGLET==='c'?'tab-c':'tab-r').focus(); }
});
document.getElementById('btn-id').onclick = ()=>LB.identityModal(()=>charger());
document.getElementById('btn-refresh').onclick = charger;
try{ document.getElementById('lb-id-slot').appendChild(LB.idButton()); }catch(e){}
dessiner();
charger();
</script>
<script src="ui.js"></script>
</body>
</html>

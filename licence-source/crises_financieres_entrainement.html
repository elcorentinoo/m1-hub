<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crises Financières · Mode entraînement</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ef; --paper2:#f3ece0; --ink:#22201b; --ink2:#4a4640;
  --muted:#8a8378; --line:#e3d9c8; --line2:#d4c7b0;
  
  /* Couleurs principales adaptées pour "Crises Financières" (Rust/Rouille) */
  --primary:#a8432a; --primary-l:#f7e6df; --primary-d:#802f1b;
  --secondary:#23456b; --secondary-l:#e3ebf4; --secondary-d:#15324f;
  
  --amber:#c87a12; --amber-l:#fbf0db;
  --plum:#6b3a73; --plum-l:#f0e7f2;
  --navy:#23456b; --navy-l:#e3ebf4;
  --gold:#b8860b;
  --ok:#1b7a4b; --ok-l:#e2f3e9; --err:#b23b2e; --err-l:#fae8e5;
  --shadow:0 1px 3px rgba(34,32,27,.08), 0 8px 24px rgba(34,32,27,.06);
  --shadow-lg:0 4px 12px rgba(34,32,27,.12), 0 20px 48px rgba(34,32,27,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--ink);
  line-height:1.65; font-size:16px;
  background-image:radial-gradient(var(--line) 0.5px, transparent 0.5px);
  background-size:22px 22px;
}

/* ── TOP BAR ── */
#topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(250,246,239,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:12px 24px; display:flex; align-items:center; gap:18px;
}
#topbar .logo{
  font-family:'Fraunces',serif; font-weight:900; font-size:18px;
  color:var(--primary-d); letter-spacing:-.5px; white-space:nowrap;
}
#topbar .logo span{color:var(--amber)}
#topbar .hub{font-family:'DM Mono',monospace; font-size:12px; color:var(--muted); text-decoration:none; white-space:nowrap; padding:5px 10px; border-radius:8px; border:1px solid var(--line); transition:all .15s}
#topbar .hub:hover{color:var(--primary-d); border-color:var(--line2); background:#fff}
.top-progress{flex:1; max-width:420px}
.top-progress-bar{height:6px; background:var(--line); border-radius:6px; overflow:hidden}
.top-progress-fill{height:100%; background:linear-gradient(90deg,var(--primary),var(--gold)); border-radius:6px; transition:width .5s cubic-bezier(.4,0,.2,1); width:0%}
.top-progress-txt{font-size:11px; color:var(--muted); margin-top:3px; font-family:'DM Mono',monospace}
.top-xp{
  font-family:'DM Mono',monospace; font-size:13px; font-weight:500;
  background:var(--amber-l); color:var(--amber); padding:5px 12px; border-radius:20px;
  border:1px solid var(--line2); white-space:nowrap;
}

/* ── LAYOUT ── */
#content{max-width:760px; margin:0 auto; padding:40px 28px 120px; min-width:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view{animation:fade .4s ease}

/* ── HOME ── */
.home-tag{font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--amber); font-weight:500; display:flex; align-items:center; gap:8px; margin-bottom:10px}
.home-tag::before{content:''; width:24px; height:2px; background:var(--amber)}
.home h1{font-family:'Fraunces',serif; font-weight:900; font-size:2.3rem; line-height:1.08; letter-spacing:-1px; margin-bottom:10px}
.home h1 .acc{color:var(--amber)}
.home-sub{font-size:16.5px; color:var(--ink2); margin-bottom:30px; max-width:560px}

.mode-card{background:#fff; border:1.5px solid var(--line); border-radius:18px; padding:24px; margin-bottom:18px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:border-color .2s, box-shadow .2s}
.mode-card:hover{box-shadow:var(--shadow-lg); border-color:var(--line2)}
.mode-card::before{content:''; position:absolute; top:0; left:0; bottom:0; width:5px}
.mode-card.m-primary::before{background:var(--primary)}
.mode-card.m-secondary::before{background:var(--secondary)}
.mode-head{display:flex; align-items:center; gap:14px; margin-bottom:8px}
.mode-icon{width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0}
.m-primary .mode-icon{background:var(--primary-l)} .m-secondary .mode-icon{background:var(--secondary-l)}
.mode-head h2{font-family:'Fraunces',serif; font-weight:700; font-size:1.3rem; color:var(--ink); letter-spacing:-.3px}
.mode-card p{font-size:14.5px; color:var(--ink2); margin-bottom:16px}
.mode-card p:last-of-type{margin-bottom:0}
.chip-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.start-chip{padding:10px 18px; border-radius:11px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:1.5px solid var(--line2); background:var(--paper); color:var(--ink2); transition:all .15s}
.start-chip:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
.m-primary .start-chip:hover{border-color:var(--primary); color:var(--primary-d); background:var(--primary-l)}
.m-secondary .start-chip.solo{background:var(--secondary); color:#fff; border-color:var(--secondary); width:100%; justify-content:center; display:flex; align-items:center; gap:8px}
.m-secondary .start-chip.solo:hover{background:var(--secondary-d)}
.mode-card.m-gold::before{background:var(--gold)}
.m-gold .mode-icon{background:#f7eccb}
.m-gold .start-chip:hover{border-color:var(--gold); color:#8a6608; background:#f7eccb}
.m-gold .start-chip.solo{background:var(--gold); color:#fff; border-color:var(--gold); width:100%; justify-content:center; display:flex; align-items:center; gap:8px}
.m-gold .start-chip.solo:hover{background:#8a6608}
.chip-lbl{font-size:12.5px; color:var(--muted); font-family:'DM Mono',monospace; margin-right:4px}
.end-link{display:block; margin:8px auto 0; background:none; border:none; color:var(--muted); font-family:'DM Mono',monospace; font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.end-link:hover{color:var(--primary)}
.level-select{background:#fff; border:1.5px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:24px; box-shadow:var(--shadow)}
.level-lbl{font-family:'DM Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--amber); font-weight:500}
.level-seg{display:flex; gap:8px; margin:12px 0 10px; flex-wrap:wrap}
.seg{flex:1; min-width:110px; padding:11px 10px; border-radius:11px; border:1.5px solid var(--line2); background:var(--paper); color:var(--ink2); font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; transition:all .15s}
.seg:hover{border-color:var(--primary); color:var(--primary-d)}
.seg.on{background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:var(--shadow)}
.level-desc{font-size:13.5px; color:var(--ink2); margin:0}

/* ── CALLOUTS ── */
.callout{border-radius:14px; padding:16px 18px; margin:18px 0; border:1px solid; font-size:14.5px}
.callout .c-label{font-family:'DM Mono',monospace; font-size:11px; font-weight:500; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; display:flex; align-items:center; gap:7px}
.callout.key{background:var(--primary-l); border-color:#e7c4b8}
.callout.key .c-label{color:var(--primary-d)}
.callout p:last-child{margin-bottom:0}

/* ── NAV BUTTONS ── */
.nav-btn{padding:13px 26px; border-radius:12px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:1.5px solid var(--line2); background:#fff; color:var(--ink2); transition:all .15s; display:inline-flex; align-items:center; gap:8px}
.nav-btn:hover{border-color:var(--primary); color:var(--primary-d)}
.nav-btn.primary{background:var(--primary); color:#fff; border-color:var(--primary)}
.nav-btn.primary:hover{background:var(--primary-d); transform:translateY(-2px); box-shadow:var(--shadow)}

/* ── QUESTION CARD ── */
.q-card{background:#fff; border:1.5px solid var(--line2); border-radius:18px; padding:28px; box-shadow:var(--shadow-lg); margin:8px 0 24px; position:relative}
.info-btn{position:absolute; top:18px; right:18px; width:34px; height:34px; border-radius:50%; background:var(--secondary-l); color:var(--secondary); font-family:'Fraunces',serif; font-weight:700; font-size:18px; font-style:italic; border:1.5px solid var(--secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; z-index:10}
.info-btn:hover{background:var(--secondary); color:#fff; transform:scale(1.05)}
.q-counter{font-family:'DM Mono',monospace; font-size:12px; color:var(--secondary); letter-spacing:1px; margin-bottom:8px}
.q-theme{font-size:11px; color:var(--muted); margin-bottom:14px; font-family:'DM Mono',monospace}
.q-text{font-family:'Fraunces',serif; font-weight:600; font-size:1.22rem; color:var(--ink); margin-bottom:6px; line-height:1.35}
.q-data{background:var(--paper2); border-radius:8px; padding:10px 14px; font-family:'DM Mono',monospace; font-size:13px; color:var(--ink2); margin:14px 0; line-height:1.7}
.q-data b{color:var(--gold)}

/* progress in session */
.s-progress{margin-bottom:22px}
.s-progress-bar{height:8px; background:var(--line); border-radius:8px; overflow:hidden}
.s-progress-fill{height:100%; background:linear-gradient(90deg,var(--secondary),var(--primary)); transition:width .4s; border-radius:8px}
.s-progress-txt{font-size:12px; color:var(--muted); margin-top:6px; font-family:'DM Mono',monospace; text-align:center}

/* QCM options */
.opts{display:flex; flex-direction:column; gap:9px; margin-top:16px}
.opt{display:flex; align-items:center; gap:12px; padding:12px 15px; background:#fff; border:1.5px solid var(--line); border-radius:10px; cursor:pointer; transition:all .15s; font-size:14.5px; user-select:none}
.opt:hover:not(.locked){border-color:var(--secondary); transform:translateX(3px)}
.opt .letter{flex-shrink:0; width:24px; height:24px; border-radius:6px; border:1.5px solid var(--line2); display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:12px; font-weight:500; color:var(--muted)}
.opt.locked{cursor:default}
.opt.correct{background:var(--ok-l); border-color:var(--ok); color:var(--ok)}
.opt.correct .letter{background:var(--ok); color:#fff; border-color:var(--ok)}
.opt.wrong{background:var(--err-l); border-color:var(--err); color:var(--err)}
.opt.wrong .letter{background:var(--err); color:#fff; border-color:var(--err)}
.opt.reveal{background:var(--ok-l); border-color:var(--ok); color:var(--ok)}

/* calc input */
.input-row{display:flex; gap:10px; align-items:center; margin-top:16px}
.calc-input{flex:1; max-width:260px; background:#fff; border:1.5px solid var(--line2); border-radius:10px; padding:12px 15px; font-family:'DM Mono',monospace; font-size:15px; color:var(--ink); outline:none}
.calc-input:focus{border-color:var(--secondary)}
.calc-unit{font-family:'DM Mono',monospace; color:var(--muted); font-size:15px}
.submit-btn{margin-top:20px; width:100%; padding:14px; background:var(--secondary); color:#fff; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-weight:700; font-size:15px; cursor:pointer; transition:all .15s}
.submit-btn:hover{background:var(--secondary-d); transform:translateY(-1px)}
.submit-btn:disabled{opacity:.4; cursor:not-allowed; transform:none}

.help-btn{background:transparent; border:1.5px dashed var(--line2); color:var(--ink2); padding:10px 16px; border-radius:10px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; transition:all .2s; margin-top:14px; display:inline-flex; align-items:center; gap:8px; width:100%; justify-content:center}
.help-btn:hover{border-color:var(--primary); color:var(--primary); background:var(--primary-l)}

/* formulaire / mémo */
.formulaire-panel{display:none; background:var(--paper); border:1.5px solid var(--line2); border-radius:12px; padding:20px; margin-top:22px; box-shadow:var(--shadow)}
.formulaire-panel.show{display:block; animation:fade .3s}
.formulaire-title{font-family:'Fraunces',serif; font-weight:700; color:var(--secondary); font-size:1.1rem; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px}
.eq-item{padding:12px 16px; border-radius:8px; margin-bottom:10px; transition:all .3s ease; border:1.5px solid transparent; background:#fff}
.eq-item .eq-name{font-size:13px; color:var(--ink); font-weight:600; margin-bottom:4px}
.eq-item .eq-desc{font-size:13px; color:var(--ink2);}
.eq-item.highlight{background:var(--ok-l); border-color:var(--ok); box-shadow:0 2px 8px rgba(27,122,75,.15); transform:translateX(4px)}

/* correction */
.corrige{display:none; margin-top:22px; border-radius:14px; padding:18px 20px; border:1.5px solid; animation:fade .35s}
.corrige.show{display:block}
.corrige.ok{background:var(--ok-l); border-color:#b9dcd4}
.corrige.no{background:var(--rust-l); border-color:#e7c4b8}
.corrige-head{font-family:'Fraunces',serif; font-weight:700; font-size:16px; margin-bottom:6px; display:flex; align-items:center; gap:8px}
.corrige.ok .corrige-head{color:var(--ok)}
.corrige.no .corrige-head{color:var(--err)}
.corrige .yours{font-size:13px; color:var(--err); font-family:'DM Mono',monospace; margin-bottom:10px}
.corrige p{font-size:14px; color:var(--ink2); margin:4px 0 10px}
.step{display:flex; gap:12px; margin-bottom:10px; align-items:flex-start}
.step-n{flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; font-family:'DM Mono',monospace; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px}
.step-txt{flex:1; font-size:14px; color:var(--ink2)}
.step-txt code{background:rgba(0,0,0,.05); padding:2px 7px; border-radius:5px; font-family:'DM Mono',monospace; font-size:12.5px; color:var(--primary-d)}
.result-line{margin-top:12px; padding:12px 16px; background:#fff; border-radius:10px; font-family:'DM Mono',monospace; font-size:14.5px; font-weight:600; color:var(--primary-d); border:1px solid #e7c4b8}
.corrige .next{margin-top:16px}

/* result screen */
.result-screen{text-align:center}
.result-emoji{font-size:72px; margin-bottom:8px}
.result-score{font-family:'Fraunces',serif; font-weight:900; font-size:3.5rem; color:var(--primary-d); line-height:1}
.result-score span{font-size:1.4rem; color:var(--muted)}
.result-title{font-family:'Fraunces',serif; font-weight:700; font-size:1.6rem; margin:12px 0 8px}
.result-msg{color:var(--ink2); font-size:15px; max-width:480px; margin:0 auto 24px}
.result-breakdown{background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; margin:24px 0; text-align:left; box-shadow:var(--shadow)}
.result-breakdown h3{font-family:'Fraunces',serif; font-size:15px; margin-bottom:14px; color:var(--ink)}
.bd-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
.bd-row:last-child{border-bottom:none}
.bd-name{flex:1; font-size:14px}
.bd-bar{width:120px; height:7px; background:var(--line); border-radius:5px; overflow:hidden}
.bd-bar-fill{height:100%; border-radius:5px}
.bd-score{font-family:'DM Mono',monospace; font-size:13px; font-weight:500; width:42px; text-align:right}

@media(max-width:760px){
  #content{padding:28px 18px 100px}
  .home h1{font-size:1.85rem}
  .top-progress{display:none}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">Crises<span>Fin</span> · Entraînement</div>
  <a class="hub" href="index.html">← Hub</a>
  <div class="top-progress">
    <div class="top-progress-bar"><div class="top-progress-fill" id="topfill"></div></div>
    <div class="top-progress-txt" id="toptxt">Choisis un mode</div>
  </div>
  <div class="top-xp" id="xp">✦ 0 XP</div>
</div>

<main id="content"></main>

<script>
// ════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════
const pick = a => a[Math.floor(Math.random()*a.length)];
const randint = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const fr = (x,d) => Number(x).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur = x => fr(x,2)+'\u00A0€';
const eur0 = x => Number(x).toLocaleString('fr-FR')+'\u00A0€';

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ════════════════════════════════════════════════════════════════════════
// BANQUE DE QUESTIONS PAR NIVEAU (Mix QCM et entrées numériques)
// ════════════════════════════════════════════════════════════════════════

const GENS = {

// ═══════════════ NIVEAU 1 · Bases, Vocabulaire & Dates ═══════════════
1: [
  () => ({
    kind:'qcm', theme:'Bases & Vocabulaire', eqId:'eq-vocab',
    q:"Laquelle de ces définitions correspond à la <strong>Stagflation</strong> ?",
    opts:["Deux trimestres consécutifs de croissance négative","Croissance quasi-nulle de très longue durée","Stagnation économique accompagnée d'une forte inflation","Une ruée bancaire généralisée"],
    correct:2, fb:"La stagflation est le pire des deux mondes : stagnation (chômage) + inflation forte. Le cas d'école est la crise pétrolière des années 1970."
  }),
  () => ({
    kind:'qcm', theme:'Bases & Vocabulaire', eqId:'eq-vocab',
    q:"Qu'est-ce qu'un <strong>Bank run</strong> (ruée bancaire) ?",
    opts:["Les banques ferment définitivement","Les clients retirent leur cash en masse, paniqués","L'État rachète les banques en difficulté","La Banque centrale injecte des liquidités"],
    correct:1, fb:"Une ruée bancaire se produit quand les clients paniquent et veulent tous retirer leur argent en même temps. La banque n'ayant jamais tout le cash en caisse, elle risque l'effondrement."
  }),
  () => ({
    kind:'qcm', theme:'Le Bilan', eqId:'eq-bilan',
    q:"Où se trouvent les <strong>dépôts des clients</strong> dans le bilan d'une banque ?",
    opts:["À l'actif (la banque possède cet argent)","Au passif (la banque doit cet argent aux clients)","Dans les fonds propres","Hors bilan"],
    correct:1, fb:"Les dépôts sont une ressource pour la banque, elle a donc une dette envers toi : c'est au PASSIF."
  }),
  () => ({
    kind:'qcm', theme:'Le Bilan', eqId:'eq-bilan',
    q:"Vrai ou faux : une banque dont les fonds propres sont positifs ne peut pas faire faillite.",
    opts:["Vrai, elle est totalement couverte","Faux, elle peut être solvable mais illiquide"],
    correct:1, fb:"Une banque solvable (FP > 0) peut tout à fait faire faillite si elle manque de liquidités immédiates pour répondre à une panique (ex: SVB)."
  }),
  () => ({
    kind:'qcm', theme:'Histoire', eqId:'eq-dates',
    q:"Laquelle de ces crises est considérée comme la <strong>première bulle spéculative</strong> documentée de l'histoire ?",
    opts:["La crise de Florence (1345)","Le système de Law (1720)","La bulle des tulipes (1637)","Le krach de l'Union Générale (1881)"],
    correct:2, fb:"La tulipomanie de 1637 aux Pays-Bas est le premier grand exemple de bulle spéculative (un actif acheté uniquement pour être revendu plus cher)."
  }),
  () => ({
    kind:'num', theme:'Histoire', eqId:'eq-dates', unit:'(année)',
    q:"En quelle année a eu lieu la célèbre banqueroute du système de <strong>John Law</strong> en France ?",
    expected:1720, tol:0,
    steps:["Le système de Law a commencé en 1716 et a explosé en <strong>1720</strong>, ruinant de nombreux actionnaires."], result:"Année = 1720"
  }),
  () => ({
    kind:'num', theme:'Histoire', eqId:'eq-dates', unit:'%',
    q:"Après l'éclatement de la bulle des tulipes, à quel pourcentage de son prix final s'est revendu le bulbe en moyenne ?",
    expected:3.5, tol:0.5,
    steps:["Le prix s'est totalement effondré. Le marché s'est liquidé à environ <strong>3,5 %</strong> du prix atteint au pic de la bulle."], result:"Pourcentage = 3,5 %"
  }),
  () => ({
    kind:'num', theme:'Réglementation', eqId:'eq-bilan', unit:'trimestres',
    q:"Combien de trimestres consécutifs de croissance négative faut-il au minimum pour déclarer officiellement une <strong>récession</strong> ?",
    expected:2, tol:0,
    steps:["La définition technique d'une récession est de <strong>2 trimestres consécutifs</strong> de baisse du PIB."], result:"Trimestres = 2"
  }),
  () => {
    // Calcul de fonds propres dynamique
    const actif = pick([100, 150, 200, 300, 500]);
    const passif = actif - randint(2, 15);
    const fp = actif - passif;
    return {
      kind:'num', theme:'Le Bilan', eqId:'eq-bilan', unit:'€',
      q:`Une banque possède <b>${actif} €</b> d'actifs (crédits, titres) et a <b>${passif} €</b> de dettes (dépôts, emprunts interbancaires).<br>À combien s'élèvent ses <strong>fonds propres</strong> ?`,

function nextCalc(){
  const pool=genPool();
  let g; do{ g=randint(0,pool.length-1); }while(pool.length>1 && g===state.lastGen);

}

}

// ── DÉMARRAGE D'UNE SÉRIE ──
function buildQueue(mode,count){
  if(mode==='exam'){
    // Mélange forcé des 3 niveaux
    const out=[];
    for(let i=0;i<count;i++){
      const lvl = (i%3)+1;
      const pool = GENS[lvl];
      out.push(pool[randint(0,pool.length-1)]());
    }
    return shuffle(out);
  } else {
    const out=[]; for(let i=0;i<count;i++) out.push(nextCalc());
    return out;
  }
}

function startSession(mode,count){
  state.mode=mode; state.count=count;
  state.infinite = (mode==='infini');
  state.label = mode==='calc'?'Série Rapide':(mode==='infini'?'Mode Libre':'Examen blanc');
  state.streak=0; state.best=0; state.lastGen=-1; state.sessionXP=0;
  state.queue = state.infinite ? [nextCalc()] : buildQueue(mode,count);
  state.idx=0; state.score=0; state.answered=[];
  renderQ();
}

// ── RENDU D'UNE QUESTION ──
function renderQ(){
  if(!state.infinite && state.idx>=state.queue.length){ renderResult(); return; }
  if(state.infinite && !state.queue[state.idx]){ state.queue[state.idx]=nextCalc(); }
  const q=state.queue[state.idx];
  const c=document.getElementById('content');

  const done=state.answered.length;
  const acc = done ? Math.round(state.score/done*100) : 0;
  const fillW = state.infinite ? acc : Math.round(state.idx/state.queue.length*100);
  const progTxt = state.infinite
    ? `Question n° ${state.idx+1} · ${state.score}/${done} justes · 🔥 série ${state.streak}`
    : `Question ${state.idx+1} / ${state.queue.length} · Score : ${state.score}`;
  const endLink = state.infinite ? `<button class="end-link" onclick="renderResult()">Terminer &amp; voir le bilan</button>` : '';

  let answer='';
  if(q.kind==='qcm'){
    answer = `<div class="opts">` + q.opts.map((o,i)=>
      `<div class="opt" onclick="selectQcm(this,${i})"><span class="letter">${String.fromCharCode(65+i)}</span> ${o}</div>`).join('') + `</div>`;
  } else {
    answer = `
      ${q.data?`<div class="q-data">${q.data}</div>`:''}
      <div class="input-row">
        <input class="calc-input" id="calc-input" type="number" step="0.1" placeholder="ta réponse"
          oninput="enableSubmit()" onkeydown="if(event.key==='Enter')submitCalc()">
        <span class="calc-unit">${q.unit||''}</span>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitCalc()" disabled>Valider</button>`;
  }

  c.innerHTML = `
    <div class="view">
      <div class="s-progress">
        <div class="s-progress-bar"><div class="s-progress-fill" style="width:${fillW}%"></div></div>
        <div class="s-progress-txt">${progTxt}</div>
        ${endLink}
      </div>
      <div class="q-card">
        <button class="info-btn" onclick="toggleFormulaire()" title="Fiche Mémo">i</button>
        <div class="q-counter">📚 ${state.mode==='exam'?'Examen Global':'Niveau '+state.level} · ${state.infinite?'n°':'Question'} ${state.idx+1}</div>
        <div class="q-theme">📘 ${q.theme}</div>
        <div class="q-text">${q.q}</div>
        ${answer}
        <button class="help-btn" id="help-btn" onclick="useHelp('${q.eqId}')">💡 Indice mémo</button>
        ${FORMULAIRE}
        <div class="corrige" id="corrige"></div>
      </div>
    </div>`;
  window.scrollTo({top:0});
}

function enableSubmit(){
  const inp=document.getElementById('calc-input'), btn=document.getElementById('submit-btn');
  if(inp&&btn) btn.disabled = inp.value.trim()==='';
}

function selectQcm(el,idx){
  const card=el.closest('.q-card');
  if(card.dataset.locked) return;
  card.dataset.locked='1';
  const q=state.queue[state.idx];
  const ok=(idx===q.correct);
  state.answered.push({theme:q.theme, ok});
  if(ok){ state.score++; state.xp+=8; state.sessionXP=(state.sessionXP||0)+8; state.streak++; state.best=Math.max(state.best,state.streak); } else { state.streak=0; }
  card.querySelectorAll('.opt').forEach((o,j)=>{
    o.classList.add('locked');
    if(j===q.correct) o.classList.add(ok&&j===idx?'correct':'reveal');
    if(j===idx&&!ok) o.classList.add('wrong');
  });
  showCorrection(ok,q,null);
}

function submitCalc(){
  const card=document.querySelector('.q-card');
  if(card.dataset.locked) return;
  const q=state.queue[state.idx];
  const inp=document.getElementById('calc-input');
  const val=parseFloat(inp.value.replace(',','.'));
  if(isNaN(val)){ inp.style.borderColor='var(--err)'; return; }
  card.dataset.locked='1';
  const ok=Math.abs(val-q.expected)<=q.tol;
  state.answered.push({theme:q.theme, ok});
  if(ok){ state.score++; state.xp+=12; state.sessionXP=(state.sessionXP||0)+12; state.streak++; state.best=Math.max(state.best,state.streak); } else { state.streak=0; }
  inp.style.borderColor = ok?'var(--ok)':'var(--err)';
  inp.style.background = ok?'var(--ok-l)':'var(--err-l)';
  document.getElementById('submit-btn').disabled=true;
  showCorrection(ok,q,val);
}

function showCorrection(ok,q,yourVal){
  document.getElementById('help-btn').style.display='none';
  document.getElementById('formulaire-panel').classList.remove('show');
  const box=document.getElementById('corrige');
  const last=(!state.infinite && state.idx===state.queue.length-1);
  const nextLbl=last?'Voir mon résultat 🎯':'Question suivante →';

  let inner='';
  inner += `<div class="corrige-head">${ok?'✅ Exact !':'❌ Pas tout à fait'}</div>`;
  if(q.kind==='num'){
    if(!ok) inner += `<div class="yours">Ta réponse : ${fr(yourVal, 1)} ${q.unit||''}</div>`;
    inner += q.steps.map((s,i)=>`<div class="step"><div class="step-n">${i+1}</div><div class="step-txt">${s}</div></div>`).join('');
    inner += `<div class="result-line">${q.result}</div>`;
  } else {
    inner += `<p>${q.fb}</p>`;
  }
  inner += `<button class="nav-btn primary next" onclick="nextQ()">${nextLbl}</button>`;
  if(state.infinite) inner += ` <button class="nav-btn" style="margin-left:8px" onclick="renderResult()">Terminer 🎯</button>`;
  box.className = 'corrige show ' + (ok?'ok':'no');
  box.innerHTML = inner;
}

function nextQ(){ state.idx++; updateTop(); renderQ(); }

function toggleFormulaire(){ document.getElementById('formulaire-panel').classList.toggle('show'); }
function useHelp(eqId){
  const panel=document.getElementById('formulaire-panel');
  panel.classList.add('show');
  document.querySelectorAll('.eq-item').forEach(el=>el.classList.remove('highlight'));
  const t=document.getElementById(eqId);
  if(t){ t.classList.add('highlight'); t.scrollIntoView({behavior:'smooth',block:'center'}); }
}

// ── RÉSULTAT ──
function renderResult(){
  const total=state.answered.length;
  if(total===0){ renderHome(); return; }
  const score=state.score, pct=Math.round(score/total*100);
  const byTheme={};
  state.answered.forEach(a=>{ if(!byTheme[a.theme]) byTheme[a.theme]={ok:0,tot:0}; byTheme[a.theme].tot++; if(a.ok) byTheme[a.theme].ok++; });

  let emoji,title,msg;
  if(pct>=90){emoji='🏆';title='Maîtrise totale !';msg='Tu connais tes auteurs et tes mécanismes sur le bout des doigts.';}
  else if(pct>=70){emoji='🎯';title='Très solide !';msg='Bonne compréhension d\'ensemble. Révise les points en orange pour le 20/20.';}
  else if(pct>=50){emoji='📈';title='Sur la bonne voie';msg='Les bases sont là, mais certaines théories ou dates se mélangent encore.';}
  else {emoji='📚';title='Encore un peu de travail';msg='Il y a des confusions entre les différentes écoles. Relis bien le cours avant de réessayer.';}
  if(state.infinite) msg += ` Meilleure série : 🔥 ${state.best} d'affilée.`;

  let bd='';
  Object.entries(byTheme).forEach(([th,d])=>{
    const p=Math.round(d.ok/d.tot*100);
    const col=p>=70?'var(--ok)':p>=40?'var(--amber)':'var(--err)';
    bd += `<div class="bd-row"><div class="bd-name">${th}</div>
      <div class="bd-bar"><div class="bd-bar-fill" style="width:${p}%;background:${col}"></div></div>
      <div class="bd-score" style="color:${col}">${d.ok}/${d.tot}</div></div>`;
  });

  document.getElementById('topfill').style.width='100%';
  document.getElementById('toptxt').textContent='Résultat';

  document.getElementById('content').innerHTML = `
    <div class="view result-screen">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${score}<span> / ${total}</span></div>
      <div class="result-title">${title}</div>
      <div class="result-msg">${msg} <strong>(${pct}% de réussite)</strong></div>
      <div class="result-breakdown"><h3>📊 Ton bilan par thème</h3>${bd}</div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="nav-btn primary" onclick="startSession('${state.mode}',${state.count})">${state.infinite?'Reprendre l\'entraînement ♾️':'Relancer une série 🔄'}</button>
        <button class="nav-btn" onclick="renderHome()">Changer de niveau</button>
        <button class="nav-btn" onclick="location.href='crises-financieres.html'">Revoir la leçon</button>
      </div>
    </div>`;
  window.scrollTo({top:0});
}

// INIT
renderHome();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Fi · Mode entraînement — Partiel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<style>
:root{
  --paper:#faf6ef; --paper2:#f3ece0; --ink:#22201b; --ink2:#4a4640;
  --muted:#8a8378; --line:#e3d9c8; --line2:#d4c7b0;
  --teal:#1b6b5e; --teal-l:#e4f0ed; --teal-d:#0f4a40;
  --amber:#c87a12; --amber-l:#fbf0db;
  --rust:#a8432a; --rust-l:#f7e6df;
  --plum:#6b3a73; --plum-l:#f0e7f2;
  --navy:#23456b; --navy-l:#e3ebf4;
  --gold:#b8860b;
  --ok:#1b7a4b; --ok-l:#e2f3e9; --err:#b23b2e; --err-l:#fae8e5;
  --shadow:0 1px 3px rgba(34,32,27,.08), 0 8px 24px rgba(34,32,27,.06);
  --shadow-lg:0 4px 12px rgba(34,32,27,.12), 0 20px 48px rgba(34,32,27,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--ink);
  line-height:1.65; font-size:16px;
  background-image:radial-gradient(var(--line) 0.5px, transparent 0.5px);
  background-size:22px 22px;
}

/* ── TOP BAR ── */
#topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(250,246,239,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:12px 24px; display:flex; align-items:center; gap:18px;
}
#topbar .logo{
  font-family:'Fraunces',serif; font-weight:900; font-size:18px;
  color:var(--teal-d); letter-spacing:-.5px; white-space:nowrap;
}
#topbar .logo span{color:var(--amber)}
#topbar .hub{font-family:'DM Mono',monospace; font-size:12px; color:var(--muted); text-decoration:none; white-space:nowrap; padding:5px 10px; border-radius:8px; border:1px solid var(--line); transition:all .15s}
#topbar .hub:hover{color:var(--teal-d); border-color:var(--line2); background:#fff}
.top-progress{flex:1; max-width:420px}
.top-progress-bar{height:6px; background:var(--line); border-radius:6px; overflow:hidden}
.top-progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); border-radius:6px; transition:width .5s cubic-bezier(.4,0,.2,1); width:0%}
.top-progress-txt{font-size:11px; color:var(--muted); margin-top:3px; font-family:'DM Mono',monospace}
.top-xp{
  font-family:'DM Mono',monospace; font-size:13px; font-weight:500;
  background:var(--amber-l); color:var(--amber); padding:5px 12px; border-radius:20px;
  border:1px solid var(--line2); white-space:nowrap;
}

/* ── LAYOUT ── */
#content{max-width:760px; margin:0 auto; padding:40px 28px 120px; min-width:0}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view{animation:fade .4s ease}

/* ── HOME ── */
.home-tag{font-family:'DM Mono',monospace; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--amber); font-weight:500; display:flex; align-items:center; gap:8px; margin-bottom:10px}
.home-tag::before{content:''; width:24px; height:2px; background:var(--amber)}
.home h1{font-family:'Fraunces',serif; font-weight:900; font-size:2.3rem; line-height:1.08; letter-spacing:-1px; margin-bottom:10px}
.home h1 .acc{color:var(--amber)}
.home-sub{font-size:16.5px; color:var(--ink2); margin-bottom:30px; max-width:560px}

.mode-card{background:#fff; border:1.5px solid var(--line); border-radius:18px; padding:24px; margin-bottom:18px; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:border-color .2s, box-shadow .2s}
.mode-card:hover{box-shadow:var(--shadow-lg); border-color:var(--line2)}
.mode-card::before{content:''; position:absolute; top:0; left:0; bottom:0; width:5px}
.mode-card.m-teal::before{background:var(--teal)}
.mode-card.m-plum::before{background:var(--plum)}
.mode-card.m-navy::before{background:var(--navy)}
.mode-head{display:flex; align-items:center; gap:14px; margin-bottom:8px}
.mode-icon{width:50px; height:50px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0}
.m-teal .mode-icon{background:var(--teal-l)} .m-plum .mode-icon{background:var(--plum-l)} .m-navy .mode-icon{background:var(--navy-l)}
.mode-head h2{font-family:'Fraunces',serif; font-weight:700; font-size:1.3rem; color:var(--ink); letter-spacing:-.3px}
.mode-card p{font-size:14.5px; color:var(--ink2); margin-bottom:16px}
.mode-card p:last-of-type{margin-bottom:0}
.chip-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.start-chip{padding:10px 18px; border-radius:11px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:1.5px solid var(--line2); background:var(--paper); color:var(--ink2); transition:all .15s}
.start-chip:hover{transform:translateY(-2px); box-shadow:var(--shadow)}
.m-teal .start-chip:hover{border-color:var(--teal); color:var(--teal-d); background:var(--teal-l)}
.m-plum .start-chip:hover{border-color:var(--plum); color:var(--plum); background:var(--plum-l)}
.m-navy .start-chip.solo{background:var(--navy); color:#fff; border-color:var(--navy); width:100%; justify-content:center; display:flex; align-items:center; gap:8px}
.m-navy .start-chip.solo:hover{background:#15324f}
.chip-lbl{font-size:12.5px; color:var(--muted); font-family:'DM Mono',monospace; margin-right:4px}

/* ── CALLOUTS ── */
.callout{border-radius:14px; padding:16px 18px; margin:18px 0; border:1px solid; font-size:14.5px}
.callout .c-label{font-family:'DM Mono',monospace; font-size:11px; font-weight:500; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; display:flex; align-items:center; gap:7px}
.callout.key{background:var(--teal-l); border-color:#b9dcd4}
.callout.key .c-label{color:var(--teal-d)}
.callout p:last-child{margin-bottom:0}

/* ── NAV BUTTONS ── */
.nav-btn{padding:13px 26px; border-radius:12px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:1.5px solid var(--line2); background:#fff; color:var(--ink2); transition:all .15s; display:inline-flex; align-items:center; gap:8px}
.nav-btn:hover{border-color:var(--teal); color:var(--teal-d)}
.nav-btn.primary{background:var(--teal); color:#fff; border-color:var(--teal)}
.nav-btn.primary:hover{background:var(--teal-d); transform:translateY(-2px); box-shadow:var(--shadow)}

/* ── QUESTION CARD ── */
.q-card{background:#fff; border:1.5px solid var(--line2); border-radius:18px; padding:28px; box-shadow:var(--shadow-lg); margin:8px 0 24px; position:relative}
.info-btn{position:absolute; top:18px; right:18px; width:34px; height:34px; border-radius:50%; background:var(--navy-l); color:var(--navy); font-family:'Fraunces',serif; font-weight:700; font-size:18px; font-style:italic; border:1.5px solid var(--navy); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; z-index:10}
.info-btn:hover{background:var(--navy); color:#fff; transform:scale(1.05)}
.q-counter{font-family:'DM Mono',monospace; font-size:12px; color:var(--plum); letter-spacing:1px; margin-bottom:8px}
.q-theme{font-size:11px; color:var(--muted); margin-bottom:14px; font-family:'DM Mono',monospace}
.q-text{font-family:'Fraunces',serif; font-weight:600; font-size:1.22rem; color:var(--ink); margin-bottom:6px; line-height:1.35}
.q-data{background:var(--paper2); border-radius:8px; padding:10px 14px; font-family:'DM Mono',monospace; font-size:13px; color:var(--ink2); margin:14px 0; line-height:1.7}
.q-data b{color:var(--gold)}

/* progress in session */
.s-progress{margin-bottom:22px}
.s-progress-bar{height:8px; background:var(--line); border-radius:8px; overflow:hidden}
.s-progress-fill{height:100%; background:linear-gradient(90deg,var(--plum),var(--teal)); transition:width .4s; border-radius:8px}
.s-progress-txt{font-size:12px; color:var(--muted); margin-top:6px; font-family:'DM Mono',monospace; text-align:center}

/* QCM options */
.opts{display:flex; flex-direction:column; gap:9px; margin-top:16px}
.opt{display:flex; align-items:center; gap:12px; padding:12px 15px; background:#fff; border:1.5px solid var(--line); border-radius:10px; cursor:pointer; transition:all .15s; font-size:14.5px; user-select:none}
.opt:hover:not(.locked){border-color:var(--plum); transform:translateX(3px)}
.opt .letter{flex-shrink:0; width:24px; height:24px; border-radius:6px; border:1.5px solid var(--line2); display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; font-size:12px; font-weight:500; color:var(--muted)}
.opt.locked{cursor:default}
.opt.correct{background:var(--ok-l); border-color:var(--ok); color:var(--ok)}
.opt.correct .letter{background:var(--ok); color:#fff; border-color:var(--ok)}
.opt.wrong{background:var(--err-l); border-color:var(--err); color:var(--err)}
.opt.wrong .letter{background:var(--err); color:#fff; border-color:var(--err)}
.opt.reveal{background:var(--ok-l); border-color:var(--ok); color:var(--ok)}

/* calc input */
.input-row{display:flex; gap:10px; align-items:center; margin-top:16px}
.calc-input{flex:1; max-width:260px; background:#fff; border:1.5px solid var(--line2); border-radius:10px; padding:12px 15px; font-family:'DM Mono',monospace; font-size:15px; color:var(--ink); outline:none}
.calc-input:focus{border-color:var(--plum)}
.calc-unit{font-family:'DM Mono',monospace; color:var(--muted); font-size:15px}
.submit-btn{margin-top:20px; width:100%; padding:14px; background:var(--plum); color:#fff; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-weight:700; font-size:15px; cursor:pointer; transition:all .15s}
.submit-btn:hover{background:#562e5d; transform:translateY(-1px)}
.submit-btn:disabled{opacity:.4; cursor:not-allowed; transform:none}

.help-btn{background:transparent; border:1.5px dashed var(--line2); color:var(--ink2); padding:10px 16px; border-radius:10px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; transition:all .2s; margin-top:14px; display:inline-flex; align-items:center; gap:8px; width:100%; justify-content:center}
.help-btn:hover{border-color:var(--ok); color:var(--ok); background:var(--ok-l)}

/* formulaire */
.formulaire-panel{display:none; background:var(--paper); border:1.5px solid var(--line2); border-radius:12px; padding:20px; margin-top:22px; box-shadow:var(--shadow)}
.formulaire-panel.show{display:block; animation:fade .3s}
.formulaire-title{font-family:'Fraunces',serif; font-weight:700; color:var(--navy); font-size:1.1rem; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px}
.eq-item{padding:12px 16px; border-radius:8px; margin-bottom:10px; transition:all .3s ease; border:1.5px solid transparent; background:#fff}
.eq-item .eq-name{font-size:12px; color:var(--muted); font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px}
.eq-item.highlight{background:var(--ok-l); border-color:var(--ok); box-shadow:0 2px 8px rgba(27,122,75,.15); transform:translateX(4px)}

/* correction */
.corrige{display:none; margin-top:22px; border-radius:14px; padding:18px 20px; border:1.5px solid; animation:fade .35s}
.corrige.show{display:block}
.corrige.ok{background:var(--ok-l); border-color:#b9dcd4}
.corrige.no{background:var(--rust-l); border-color:#e7c4b8}
.corrige-head{font-family:'Fraunces',serif; font-weight:700; font-size:16px; margin-bottom:6px; display:flex; align-items:center; gap:8px}
.corrige.ok .corrige-head{color:var(--teal-d)}
.corrige.no .corrige-head{color:var(--rust)}
.corrige .yours{font-size:13px; color:var(--rust); font-family:'DM Mono',monospace; margin-bottom:10px}
.corrige p{font-size:14px; color:var(--ink2); margin:4px 0 10px}
.step{display:flex; gap:12px; margin-bottom:10px; align-items:flex-start}
.step-n{flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--teal); color:#fff; font-family:'DM Mono',monospace; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px}
.step-txt{flex:1; font-size:14px; color:var(--ink2)}
.step-txt code{background:rgba(0,0,0,.05); padding:2px 7px; border-radius:5px; font-family:'DM Mono',monospace; font-size:12.5px; color:var(--teal-d)}
.result-line{margin-top:12px; padding:12px 16px; background:#fff; border-radius:10px; font-family:'DM Mono',monospace; font-size:14.5px; font-weight:600; color:var(--teal-d); border:1px solid #b9dcd4}
.corrige .next{margin-top:16px}

/* result screen */
.result-screen{text-align:center}
.result-emoji{font-size:72px; margin-bottom:8px}
.result-score{font-family:'Fraunces',serif; font-weight:900; font-size:3.5rem; color:var(--teal-d); line-height:1}
.result-score span{font-size:1.4rem; color:var(--muted)}
.result-title{font-family:'Fraunces',serif; font-weight:700; font-size:1.6rem; margin:12px 0 8px}
.result-msg{color:var(--ink2); font-size:15px; max-width:480px; margin:0 auto 24px}
.result-breakdown{background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; margin:24px 0; text-align:left; box-shadow:var(--shadow)}
.result-breakdown h3{font-family:'Fraunces',serif; font-size:15px; margin-bottom:14px; color:var(--ink)}
.bd-row{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
.bd-row:last-child{border-bottom:none}
.bd-name{flex:1; font-size:14px}
.bd-bar{width:120px; height:7px; background:var(--line); border-radius:5px; overflow:hidden}
.bd-bar-fill{height:100%; border-radius:5px}
.bd-score{font-family:'DM Mono',monospace; font-size:13px; font-weight:500; width:42px; text-align:right}

.meta-chips{display:flex; gap:10px; justify-content:flex-start; flex-wrap:wrap; margin:18px 0 4px}
.meta-chips .chip{background:var(--paper2); border:1px solid var(--line2); padding:7px 14px; border-radius:20px; font-size:13px; color:var(--ink2); display:flex; align-items:center; gap:6px}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2); border-radius:4px}

@media(max-width:760px){
  #content{padding:28px 18px 100px}
  .home h1{font-size:1.85rem}
  .top-progress{display:none}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">Maths<span>Fi</span> · Entraînement</div>
  <a class="hub" href="index.html">← Hub</a>
  <div class="top-progress">
    <div class="top-progress-bar"><div class="top-progress-fill" id="topfill"></div></div>
    <div class="top-progress-txt" id="toptxt">Choisis un mode</div>
  </div>
  <div class="top-xp" id="xp">✦ 0 XP</div>
</div>

<main id="content"></main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<script>
// ════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════
const pick = a => a[Math.floor(Math.random()*a.length)];
const randint = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const round = (x,d=2) => Math.round(x*Math.pow(10,d))/Math.pow(10,d);
const fr = (x,d) => Number(x).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const eur = x => fr(x,2)+'\u00A0€';
const eur0 = x => Number(x).toLocaleString('fr-FR')+'\u00A0€';
const gp = x => Number(x).toLocaleString('fr-FR',{maximumFractionDigits:2})+'\u00A0%';

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ════════════════════════════════════════════════════════════════════════
// GÉNÉRATEURS DE CALCULS  (numéros tirés au hasard, réponse calculée)
// chaque générateur renvoie un objet question entièrement résolu
// ════════════════════════════════════════════════════════════════════════
const PER = [{p:12,lbl:'mensuel'},{p:4,lbl:'trimestriel'},{p:2,lbl:'semestriel'}];

const GENS = [

// 1 — Intérêt composé : valeur acquise
function(){
  const C0=pick([1000,1500,2000,2500,3000,5000,8000,10000,12000,15000,20000]);
  const t=pick([2,2.5,3,3.5,4,4.5,5,6]); const n=randint(3,10); const td=t/100;
  const f=Math.pow(1+td,n); const Cn=C0*f;
  return {kind:'calc', theme:'Intérêt composé', eqId:'eq-ic', unit:'€',
    q:`Vous placez <b>${eur0(C0)}</b> pendant <b>${n} ans</b> à <b>${gp(t)}/an</b> en intérêts composés.<br>Quelle est la <strong>valeur acquise</strong> Cₙ ?`,
    data:`C₀ = ${eur(C0)} · t = ${gp(t)} · n = ${n} ans`,
    expected:round(Cn,2), tol:Math.max(1,Cn*0.0009),
    steps:[
      `On capitalise : <code>Cₙ = C₀ × (1 + t)ⁿ</code>`,
      `<code>(1 + ${fr(td,4)})^${n} = ${fr(f,5)}</code>`,
      `<code>${eur0(C0)} × ${fr(f,5)}</code>`],
    result:`Cₙ = ${eur(Cn)}`};
},

// 2 — Intérêt simple : valeur acquise (durée en mois)
function(){
  const C0=pick([1000,1500,2000,2400,3000,3600,4000,5000,6000]);
  const t=pick([2,3,3.6,4,5,6]); const m=pick([3,4,6,8,9,10]); const td=t/100;
  const I=C0*td*(m/12); const Cn=C0+I;
  return {kind:'calc', theme:'Intérêt simple', eqId:'eq-is', unit:'€',
    q:`Vous placez <b>${eur0(C0)}</b> à <b>${gp(t)}/an</b> en <strong>intérêts simples</strong> pendant <b>${m} mois</b>.<br>Quelle est la valeur acquise ?`,
    data:`C₀ = ${eur(C0)} · t = ${gp(t)} (annuel) · n = ${m} mois`,
    expected:round(Cn,2), tol:Math.max(1,Cn*0.0009),
    steps:[
      `Le taux est annuel → on met la durée en années : <code>n = ${m}/12 = ${fr(m/12,4)}</code>`,
      `Intérêts : <code>I = C₀ × t × n = ${eur0(C0)} × ${fr(td,4)} × ${fr(m/12,4)} = ${eur(I)}</code>`,
      `<code>Cₙ = C₀ + I = ${eur0(C0)} + ${fr(I,2)}</code>`],
    result:`Cₙ = ${eur(Cn)}`};
},

// 3 — Actualisation
function(){
  const Cn=pick([10000,15000,20000,25000,30000,40000,50000]);
  const t=pick([2,3,4,5,6]); const n=randint(3,8); const td=t/100;
  const fInv=Math.pow(1+td,-n); const C0=Cn*fInv;
  return {kind:'calc', theme:'Actualisation', eqId:'eq-actu', unit:'€',
    q:`Quelle somme placer aujourd'hui à <b>${gp(t)}/an</b> (intérêts composés) pour disposer de <b>${eur0(Cn)}</b> dans <b>${n} ans</b> ?`,
    data:`Cₙ = ${eur(Cn)} · t = ${gp(t)} · n = ${n} ans · cherche C₀`,
    expected:round(C0,2), tol:Math.max(1,C0*0.0009),
    steps:[
      `On actualise : <code>C₀ = Cₙ × (1 + t)⁻ⁿ</code>`,
      `<code>(1 + ${fr(td,4)})⁻${n} = ${fr(fInv,6)}</code>  (= 1 / ${fr(Math.pow(1+td,n),5)})`,
      `<code>${eur0(Cn)} × ${fr(fInv,6)}</code>`],
    result:`C₀ = ${eur(C0)}`};
},

// 4 — Taux équivalent
function(){
  const t=pick([3,4,5,6,8,10,12]); const per=pick(PER); const td=t/100;
  const f=Math.pow(1+td,1/per.p); const te=(f-1)*100;
  return {kind:'calc', theme:'Taux équivalent / proportionnel', eqId:'eq-tequiv', unit:'%',
    q:`Le taux annuel est de <b>${gp(t)}</b>. Quel est le taux <b>${per.lbl}</b> <strong>équivalent</strong> (intérêts composés) ?<br><span style="font-size:13px;color:var(--muted)">Réponse en %, 3 à 4 décimales.</span>`,
    data:`t annuel = ${gp(t)} · p = ${per.p} sous-périodes/an`,
    expected:round(te,4), tol:0.012,
    steps:[
      `Taux équivalent (composé) : <code>tₑ = (1 + t)^(1/p) − 1</code>`,

function(){
  const C0=pick([2000,2400,3000,5000,8000,10000]); const n=randint(2,6); const t=pick([2,3,4,5,6]);
  const td=t/100; const Cn=round(C0*Math.pow(1+td,n),2);

  return {kind:'calc', theme:'Recherche de taux', eqId:'eq-ic', unit:'%',
    q:`Un capital de <b>${eur0(C0)}</b> devient <b>${eur(Cn)}</b> après <b>${n} ans</b> en intérêts composés.<br>Quel est le <strong>taux annuel</strong> ? (en %)`,
    data:`C₀ = ${eur(C0)} · Cₙ = ${eur(Cn)} · n = ${n} ans · cherche t`,
    expected:round(tCalc,4), tol:0.1,

      `On part de <code>Cₙ = C₀ (1+t)ⁿ</code> → <code>(1+t)ⁿ = Cₙ/C₀ = ${fr(ratio,5)}</code>`,
      `<code>1+t = ${fr(ratio,5)}^(1/${n}) = ${fr(Math.pow(ratio,1/n),5)}</code>`,
      `<code>t = ${fr(Math.pow(ratio,1/n)-1,5)} ≈ ${fr(tCalc,2)} %</code>`],

},

        <p>Les réflexes de cours : quelle formule choisir, les pièges (taux équivalent vs proportionnel, raison vs taux), le coût des modalités d'emprunt, le TAEG, les conditions des rentes perpétuelles. ${QCM.length} questions au total.</p>
        <div class="chip-row">
          <span class="chip-lbl">Série de</span>
          <button class="start-chip" onclick="startSession('qcm',10)">10 questions</button>
          <button class="start-chip" onclick="startSession('qcm',15)">15 questions</button>
          <button class="start-chip" onclick="startSession('qcm',${QCM.length})">Toutes (${QCM.length})</button>
        </div>
      </div>

      <div class="mode-card m-navy">
        <div class="mode-head"><div class="mode-icon">🎯</div><h2>Examen blanc</h2></div>
        <p>Conditions du partiel : un mix de calculs et de questions de cours d'affilée, sans repasser par le menu. 12 questions, bilan par thème à la fin.</p>
        <div class="chip-row">
          <button class="start-chip solo" onclick="startSession('exam',12)">Lancer l'examen blanc →</button>
        </div>
      </div>

      <div class="callout key">
        <div class="c-label">🔑 Comment t'en servir</div>
        <p>Pose ta réponse <strong>avant</strong> de valider. Le bouton « i » ouvre le formulaire d'examen, l'indice 💡 surligne la formule à utiliser. Chaque calcul est corrigé pas à pas, juste ou faux.</p>
      </div>
    </div>`;
}

// ── DÉMARRAGE D'UNE SÉRIE ──
function buildQueue(mode,count){
  if(mode==='qcm'){
    return shuffle(QCM).slice(0,count).map(q=>Object.assign({},q,{kind:'qcm'}));
  }
  if(mode==='calc'){
    const out=[]; let last=-1;
    for(let i=0;i<count;i++){
      let g; do{ g=randint(0,GENS.length-1); }while(GENS.length>1 && g===last);
      last=g; out.push(GENS[g]());
    }
    return out;
  }
  // exam : mix ~60% calculs
  const nCalc=Math.ceil(count*0.6), nQcm=count-nCalc;
  const calcs=[]; let last=-1;
  for(let i=0;i<nCalc;i++){ let g; do{ g=randint(0,GENS.length-1); }while(GENS.length>1 && g===last); last=g; calcs.push(GENS[g]()); }
  const qcms=shuffle(QCM).slice(0,nQcm).map(q=>Object.assign({},q,{kind:'qcm'}));
  return shuffle(calcs.concat(qcms));
}

function startSession(mode,count){
  state.mode=mode; state.count=count;
  state.label = mode==='calc'?'Calculs':(mode==='qcm'?'QCM':'Examen blanc');
  state.queue = buildQueue(mode,count);
  state.idx=0; state.score=0; state.answered=[];
  renderQ();
}

// ── RENDU D'UNE QUESTION ──
function renderQ(){
  if(state.idx>=state.queue.length){ renderResult(); return; }
  const q=state.queue[state.idx];
  const pct=Math.round(state.idx/state.queue.length*100);
  const c=document.getElementById('content');

  let answer='';
  if(q.kind==='qcm'){
    answer = `<div class="opts">` + q.opts.map((o,i)=>
      `<div class="opt" onclick="selectQcm(this,${i})"><span class="letter">${String.fromCharCode(65+i)}</span> ${o}</div>`).join('') + `</div>`;
  } else {
    answer = `
      ${q.data?`<div class="q-data">${q.data}</div>`:''}
      <div class="input-row">
        <input class="calc-input" id="calc-input" type="text" inputmode="decimal" placeholder="ta réponse"
          oninput="enableSubmit()" onkeydown="if(event.key==='Enter')submitCalc()">
        <span class="calc-unit">${q.unit||''}</span>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitCalc()" disabled>Valider</button>`;
  }

  c.innerHTML = `
    <div class="view">
      <div class="s-progress">
        <div class="s-progress-bar"><div class="s-progress-fill" style="width:${pct}%"></div></div>
        <div class="s-progress-txt">Question ${state.idx+1} / ${state.queue.length} · Score : ${state.score}</div>
      </div>
      <div class="q-card">
        <button class="info-btn" onclick="toggleFormulaire()" title="Formulaire d'examen">i</button>
        <div class="q-counter">${q.kind==='calc'?'🧮 Calcul':'📚 QCM'} · Question ${state.idx+1}</div>
        <div class="q-theme">📘 ${q.theme}</div>
        <div class="q-text">${q.q}</div>
        ${answer}
        <button class="help-btn" id="help-btn" onclick="useHelp('${q.eqId}')">💡 Indice : quelle formule utiliser ?</button>
        ${FORMULAIRE}
        <div class="corrige" id="corrige"></div>
      </div>
    </div>`;
  renderMath();
  window.scrollTo({top:0});
}

function enableSubmit(){
  const inp=document.getElementById('calc-input'), btn=document.getElementById('submit-btn');
  if(inp&&btn) btn.disabled = inp.value.trim()==='';
}

function selectQcm(el,idx){
  const card=el.closest('.q-card');
  if(card.dataset.locked) return;
  card.dataset.locked='1';
  const q=state.queue[state.idx];
  const ok=(idx===q.correct);
  state.answered.push({theme:q.theme, ok});
  if(ok){ state.score++; state.xp+=8; }
  card.querySelectorAll('.opt').forEach((o,j)=>{
    o.classList.add('locked');
    if(j===q.correct) o.classList.add(ok&&j===idx?'correct':'reveal');
    if(j===idx&&!ok) o.classList.add('wrong');
  });
  showCorrection(ok,q,null);
}

function submitCalc(){
  const card=document.querySelector('.q-card');
  if(card.dataset.locked) return;
  const q=state.queue[state.idx];
  const inp=document.getElementById('calc-input');
  const raw=inp.value.replace(/\s/g,'').replace(/€|%/g,'').replace(',','.');
  const val=parseFloat(raw);
  if(isNaN(val)){ inp.style.borderColor='var(--err)'; return; }
  card.dataset.locked='1';
  const ok=Math.abs(val-q.expected)<=q.tol;
  state.answered.push({theme:q.theme, ok});
  if(ok){ state.score++; state.xp+=12; }
  inp.style.borderColor = ok?'var(--ok)':'var(--err)';
  inp.style.background = ok?'var(--ok-l)':'var(--err-l)';
  document.getElementById('submit-btn').disabled=true;
  showCorrection(ok,q,val);
}

function showCorrection(ok,q,yourVal){
  document.getElementById('help-btn').style.display='none';
  document.getElementById('formulaire-panel').classList.remove('show');
  const box=document.getElementById('corrige');
  const last=(state.idx===state.queue.length-1);
  const nextLbl=last?'Voir mon résultat 🎯':'Question suivante →';

  let inner='';
  if(q.kind==='calc'){
    inner += `<div class="corrige-head">${ok?'✅ Correct !':'❌ Pas tout à fait'}</div>`;
    if(!ok) inner += `<div class="yours">Ta réponse : ${fr(yourVal, q.unit==='%'?4:2)} ${q.unit||''}</div>`;
    inner += q.steps.map((s,i)=>`<div class="step"><div class="step-n">${i+1}</div><div class="step-txt">${s}</div></div>`).join('');
    inner += `<div class="result-line">${q.result}</div>`;
  } else {
    inner += `<div class="corrige-head">${ok?'✅ Exact !':'❌ Pas tout à fait'}</div>`;
    inner += `<p>${q.fb}</p>`;
  }
  inner += `<button class="nav-btn primary next" onclick="nextQ()">${nextLbl}</button>`;
  box.className = 'corrige show ' + (ok?'ok':'no');
  box.innerHTML = inner;
  renderMath(box);
}

function nextQ(){ state.idx++; updateTop(); renderQ(); }

// ── FORMULAIRE / INDICE ──
function toggleFormulaire(){ document.getElementById('formulaire-panel').classList.toggle('show'); renderMath(); }
function useHelp(eqId){
  const panel=document.getElementById('formulaire-panel');
  panel.classList.add('show'); renderMath(panel);
  document.querySelectorAll('.eq-item').forEach(el=>el.classList.remove('highlight'));
  const t=document.getElementById(eqId);
  if(t){ t.classList.add('highlight'); t.scrollIntoView({behavior:'smooth',block:'center'}); }
}

// ── RÉSULTAT ──
function renderResult(){
  const total=state.queue.length, score=state.score, pct=Math.round(score/total*100);
  const byTheme={};
  state.answered.forEach(a=>{ if(!byTheme[a.theme]) byTheme[a.theme]={ok:0,tot:0}; byTheme[a.theme].tot++; if(a.ok) byTheme[a.theme].ok++; });

  let emoji,title,msg;
  if(pct>=90){emoji='🏆';title='Maîtrise totale !';msg='Tu es prêt pour le partiel.';}
  else if(pct>=70){emoji='🎯';title='Très solide !';msg='Bonne maîtrise d\'ensemble, peaufine les thèmes en orange.';}
  else if(pct>=50){emoji='📈';title='Sur la bonne voie';msg='Les bases sont là. Reprends les thèmes faibles puis relance une série.';}
  else {emoji='📚';title='Encore un peu de travail';msg='Pas de panique : revois les leçons du parcours, puis réentraîne-toi ici.';}

  let bd='';
  Object.entries(byTheme).forEach(([th,d])=>{
    const p=Math.round(d.ok/d.tot*100);
    const col=p>=70?'var(--ok)':p>=40?'var(--amber)':'var(--err)';
    bd += `<div class="bd-row"><div class="bd-name">${th}</div>
      <div class="bd-bar"><div class="bd-bar-fill" style="width:${p}%;background:${col}"></div></div>
      <div class="bd-score" style="color:${col}">${d.ok}/${d.tot}</div></div>`;
  });

  document.getElementById('topfill').style.width='100%';
  document.getElementById('toptxt').textContent='Résultat';

  document.getElementById('content').innerHTML = `
    <div class="view result-screen">
      <div class="result-emoji">${emoji}</div>
      <div class="result-score">${score}<span> / ${total}</span></div>
      <div class="result-title">${title}</div>
      <div class="result-msg">${msg} <strong>(${pct}% de réussite)</strong></div>
      <div class="result-breakdown"><h3>📊 Ton bilan par thème</h3>${bd}</div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="nav-btn primary" onclick="startSession('${state.mode}',${state.count})">Relancer une série 🔄</button>
        <button class="nav-btn" onclick="renderHome()">Changer de mode</button>
        <button class="nav-btn" onclick="location.href='maths_fi.html'">Revoir les leçons</button>
      </div>
    </div>`;
  window.scrollTo({top:0});
}

// INIT
renderHome();
</script>
